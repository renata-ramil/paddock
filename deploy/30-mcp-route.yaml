# Routing /mcp on the gateway to the paddock tool server.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: paddock-tools
  namespace: paddock
spec:
  mcp:
    targets:
    - name: paddock-tools
      static:
        backendRef:
          name: paddock-tools
        port: 8000
        protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paddock-tools
  namespace: paddock
spec:
  parentRefs:
  - name: agentgateway-proxy
    namespace: agentgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /mcp
    backendRefs:
    - name: paddock-tools
      group: agentgateway.dev
      kind: AgentgatewayBackend
